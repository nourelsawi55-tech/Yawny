<style>
:root{
  --s1:#dfe9ff;--s2:#f7e3f1;--s3:#e2f6ec;--d1:#0a0b1a;--d2:#1a0f24;--d3:#07181a;
  --ba:#0a84ff;--bb:#a35cf2;--ac:#0a84ff;--ac2:#bf5af2;
  --b1:var(--s1);--b2:var(--s2);--b3:var(--s3);
  --ink:#1c1c1e;--muted:#6b6b72;--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.4);
  --edge:rgba(255,255,255,.78);--shadow:rgba(40,50,120,.14);--track:rgba(60,60,67,.12);--solid:#fff;
  --gym:#ff9f0a;--food:#30c85e;--prayer:#0a84ff;--study:#a35cf2;--stats:#ff453a;--social:#14b8a6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
:root[data-skin="sunset"]{--s1:#ffe8d6;--s2:#ffd9e4;--s3:#fff3cf;--d1:#1c0e0a;--d2:#240f1a;--d3:#1d1405;--ba:#ff7a45;--bb:#ff2d78;--ac:#ff7a45;--ac2:#ff2d78}
:root[data-skin="forest"]{--s1:#dcf3e6;--s2:#e6f5d8;--s3:#d8eef2;--d1:#04140d;--d2:#0a1a10;--d3:#041518;--ba:#30c85e;--bb:#14b8a6;--ac:#22c55e;--ac2:#14b8a6}
:root[data-skin="grape"]{--s1:#ece3ff;--s2:#f9e0f6;--s3:#dfe6ff;--d1:#120a24;--d2:#1f0b2b;--d3:#0b0f2a;--ba:#8b5cf6;--bb:#ec4899;--ac:#8b5cf6;--ac2:#ec4899}
:root[data-skin="rose"]{--s1:#ffe3ea;--s2:#fde7f3;--s3:#ffefe0;--d1:#1f0b13;--d2:#240d1c;--d3:#1f1008;--ba:#fb7185;--bb:#f59e0b;--ac:#f43f5e;--ac2:#fb923c}
:root[data-skin="graphite"]{--s1:#e9e9ee;--s2:#f1f1f4;--s3:#e4e6ea;--d1:#0d0d0f;--d2:#151518;--d3:#101113;--ba:#8e8e93;--bb:#636366;--ac:#636366;--ac2:#98989d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --b1:var(--d1);--b2:var(--d2);--b3:var(--d3);--ink:#f5f5f7;--muted:#a1a1a8;
  --glass:rgba(44,44,60,.55);--glass2:rgba(70,70,92,.34);--edge:rgba(255,255,255,.14);--shadow:rgba(0,0,0,.45);--track:rgba(255,255,255,.14);--solid:#2c2c3c}}
:root[data-theme="dark"]{
  --b1:var(--d1);--b2:var(--d2);--b3:var(--d3);--ink:#f5f5f7;--muted:#a1a1a8;
  --glass:rgba(44,44,60,.55);--glass2:rgba(70,70,92,.34);--edge:rgba(255,255,255,.14);--shadow:rgba(0,0,0,.45);--track:rgba(255,255,255,.14);--solid:#2c2c3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);line-height:1.6;
  font-family:"IBM Plex Sans Arabic",-apple-system,"SF Pro Text",system-ui,Tahoma,sans-serif;
  background:linear-gradient(135deg,var(--b1),var(--b2) 55%,var(--b3)) fixed;transition:background .6s}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
body::before{width:46vmax;height:46vmax;top:-14vmax;right:-10vmax;background:radial-gradient(circle,var(--ba),transparent 68%);animation:drift 22s ease-in-out infinite alternate}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--edge);border-radius:26px;box-shadow:0 10px 40px var(--shadow),inset 0 1px 0 rgba(255,255,255,.3)}

/* keyframes */
@keyframes drift{to{transform:translate(-6vmax,5vmax) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes tick{from{transform:rotate(45deg) scale(0)}to{transform:rotate(45deg) scale(1)}}
@keyframes fill{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12) rotate(-5deg)}60%{transform:scale(.96) rotate(4deg)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
@keyframes sheen{from{background-position:200% 0}to{background-position:-200% 0}}

/* shell */
.shell{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:16px 16px 112px}
.side{display:none}
.tabbar{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;border-bottom:0}

.tb.on .i{transform:translateY(-2px) scale(1.15)}
.tb:active{transform:scale(.92)}

function catPct(cat,k){
 const D=peek(k),items=S.tasks[cat];
 if(cat==='gym'&&D.gym==='راحة')return 1;
 let total=items.length,done=items.filter(t=>D.d[t.id]).length;
 if(cat==='gym'){total++;if((D.ex||[]).some(e=>e.s.length))done++}
 if(cat==='food'){total++;done+=Math.min(D.water/WATER,1);total++;done+=Math.min((D.st||0)/S.prof.sg,1)}

}

}

  const k=el.dataset.k,t=+el.dataset.t,p=el.dataset.p,s=prev[k]??0;
  const set=v=>{if(p==='ring')el.style.strokeDashoffset=326.7*(1-v);else if(p==='w')el.style.width=v*100+'%';else el.style.height=Math.max(v*100,3)+'%'};
  set(s);void el.getBoundingClientRect();set(t);prev[k]=t;
 });
 document.querySelectorAll('[data-n]').forEach(el=>{
  const k='n'+el.dataset.n,t=+el.dataset.v,s=prev[k]??0,t0=performance.now();prev[k]=t;
  (function f(now){const r=Math.min((now-t0)/800,1),v=Math.round(s+(t-s)*(1-Math.pow(1-r,3)));el.textContent=num(v)+'٪';if(r<1)requestAnimationFrame(f)})(t0);
 });
}
function render(){
 const nav=t=>`<button class="nv ${tab===t.id?'on':''}" style="--c:${t.c}" data-a="tab" data-t="${t.id}">${ic(t.id)}${t.name}</button>`;
 const BAR=[TABS[0],TABS[1],TABS[2],TABS[5],{id:'more',name:'المزيد',c:'var(--muted)'}];
 const bar=t=>`<button class="tb ${tab===t.id||(t.id==='more'&&['prayer','study','stats','settings'].includes(tab))?'on':''}" style="--c:${t.c}" data-a="tab" data-t="${t.id}">${ic(t.id)}${t.name}</button>`;
 const [st]=streaks();
 const page=tab==='home'?home():tab==='stats'?statsPage():tab==='friends'?friends():tab==='settings'?settings():tab==='more'?morePage():catPage(CATS.find(c=>c.id===tab));
 document.getElementById('app').innerHTML=`
  <aside class="side glass"><div class="brand"><i>${ic('spark')}</i>يومي</div>${TABS.map(nav).join('')}<div class="sp"></div>
   <button class="nv ${tab==='settings'?'on':''}" style="--c:var(--muted)" data-a="tab" data-t="settings">${ic('sliders')}الإعدادات</button>
   <div class="chip" style="justify-content:center">${ic('flame','fl')}${num(st)} يوم متتالي</div></aside>
  <main class="main ${entering?'enter':''}">${page}</main>
  <nav class="tabbar glass" aria-label="التنقل">${BAR.map(bar).join('')}</nav>`;
 document.querySelectorAll('.main>*').forEach((el,i)=>el.style.setProperty('--n',i));
 entering=false;popT=null;popW=null;foldify();motion();
}
function toast(m){
 document.querySelectorAll('.toast').forEach(e=>e.remove());
 const t=document.createElement('div');t.className='toast glass';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2300);
}
function burst(){
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const cols=['#0a84ff','#30c85e','#ff9f0a','#a35cf2','#ff453a','#14b8a6'];
 for(let i=0;i<30;i++){
  const e=document.createElement('i');
  e.style.cssText=`position:fixed;z-index:50;left:50%;top:36%;width:8px;height:12px;border-radius:2px;pointer-events:none;background:${cols[i%6]}`;
  document.body.appendChild(e);
  const a=Math.random()*Math.PI*2,d=110+Math.random()*190;
  e.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+100}px) rotate(${Math.random()*720}deg)`,opacity:0}],
   {duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>e.remove();
 }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,b4=dayPct(cur);let top=false;
 if(a==='tab'){tab=b.dataset.t;editing=false;entering=true;top=true}
 else if(a==='shift')cur=shift(cur,+b.dataset.v);
 else if(a==='today')cur=todayKey;
 else if(a==='jump')cur=b.dataset.k;
 else if(a==='theme'){S.theme=b.dataset.v||null;applyTheme()}
 else if(a==='skin'){S.skin=b.dataset.v;applyTheme()}
 else if(a==='toggle'){const D=day(cur);D.d[b.dataset.id]=!D.d[b.dataset.id];if(D.d[b.dataset.id])popT=b.dataset.id}
 else if(a==='edit')editing=!editing;
 else if(a==='del'){if(!confirm('تحذف المهمة دي؟'))return;S.tasks[b.dataset.cat]=S.tasks[b.dataset.cat].filter(t=>t.id!==b.dataset.id)}
 else if(a==='water'){const D=day(cur),i=+b.dataset.i+1,o=D.water;D.water=o===i?i-1:i;if(D.water>o)popW=[o,D.water]}
 else if(a==='type'){const D=day(cur);D.gym=D.gym===b.dataset.v?'':b.dataset.v}
 else if(a==='min'){const D=day(cur);D.study=Math.max(0,D.study+(+b.dataset.v))}
 else if(a==='chal')S.chal=+b.dataset.v;
 else if(a==='delf'){if(!confirm('تشيل الصديق ده من التحدي؟'))return;S.friends=S.friends.filter(f=>f.id!==b.dataset.id)}
 else if(a==='copy'){
  if(!S.me.name){toast('اكتب اسمك الأول');return}
  const t=myCode(),ok=()=>toast('تم نسخ الكود');
  const fb=()=>{const m=document.getElementById('mycode');m.select();try{document.execCommand('copy');ok()}catch(x){toast('انسخ الكود يدويًا')}};
  navigator.clipboard?navigator.clipboard.writeText(t).then(ok).catch(fb):fb();return;
 }
 else if(a==='addf'){addF(document.getElementById('fcode').value);return}
 else if(X[a]){if(X[a](b)===1)return}
 else if(a==='export'){
  const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  const l=document.createElement('a');l.href=u;l.download='yawmi-backup-'+todayKey+'.json';l.click();URL.revokeObjectURL(u);return;
 }
 else if(a==='import'){document.getElementById('imp').click();return}
 else if(a==='reset'){if(!confirm('هتمسح كل بياناتك نهائيًا. متأكد؟'))return;S=fresh();fix();applyTheme()}
 save();const y=window.scrollY;render();window.scrollTo(0,top?0:y);
 if(b4<1&&dayPct(cur)>=1)burst();
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('form.add');if(!f)return;e.preventDefault();
 const v=f.querySelector('input').value.trim();if(!v)return;
 S.tasks[f.dataset.cat].push({id:'c'+Date.now(),t:v});save();
 const y=window.scrollY;render();window.scrollTo(0,y);
});
document.addEventListener('input',e=>{
 const n=e.target.closest('[data-note]');
 if(n){day(cur).n[n.dataset.note]=n.value;save();return}
 const f=e.target.closest('[data-field]');
 if(f){S.me.name=f.value.trim();save();const m=document.getElementById('mycode');if(m)m.value=S.me.name?myCode():''}
});
document.getElementById('imp').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.tasks||!o.days)throw 0;S=o;fix();applyTheme();save();render();toast('تم استيراد النسخة')}catch(x){toast('الملف ده مش نسخة صالحة')}};
 r.readAsText(f);e.target.value='';
});
if(location.hash.includes('YW1.')){tab='friends';addF(decodeURIComponent(location.hash.slice(1)));history.replaceState(null,'',location.pathname+location.search)}
if(S.auto)autoOn(false);sync(true);setInterval(()=>sync(true),300000);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
